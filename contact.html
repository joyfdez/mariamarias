<script>
/* Live Madrid clock */
(function () {
  const el = document.getElementById('madridClock');
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Madrid',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  const tick = () => { el.textContent = `Madrid, ${fmt.format(new Date())}`; };
  tick();
  setInterval(tick, 1000);
})();

/* Decorative avatar video: plays once on load, freezes on its last
   frame, and replays from the start on hover — never a manual player. */
(function () {
  const video = document.getElementById('contactVideo');
  if (!video) return;

  const freezeOnLastFrame = () => {
    video.currentTime = Math.max(0, video.duration - 0.05);
    video.pause();
  };

  video.addEventListener('ended', freezeOnLastFrame);

  video.closest('.contact-avatar').addEventListener('mouseenter', () => {
    video.currentTime = 0;
    video.play();
  });

  /* iOS Safari's autoplay policy is stricter than muted+playsinline
     alone reliably satisfies on every real device/OS version. Calling
     play() on a video that's already playing is a harmless no-op, so
     this fallback is safe to register unconditionally rather than
     trying to detect the failure first — retry on the page's first
     touch/scroll (both count as a user gesture there). */
  const retryPlay = () => {
    video.play().catch(() => {});
  };
  window.addEventListener('touchstart', retryPlay, { passive: true, once: true });
  window.addEventListener('scroll', retryPlay, { passive: true, once: true });

  /* Mute toggle — works whether the video is mid-play or already
     frozen on its last frame; toggling .muted never touches
     playback state, so it doesn't fight the hover-replay/freeze
     logic above. */
  const muteBtn = document.getElementById('contactVideoMute');
  const ICON_MUTED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,9 4,15 8,15 13,20 13,4 8,9" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  const ICON_UNMUTED = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,9 4,15 8,15 13,20 13,4 8,9" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  if (muteBtn) {
    const t = window.I18N ? window.I18N.t : function () { return ''; };
    function syncMuteButton() {
      muteBtn.innerHTML = video.muted ? ICON_MUTED : ICON_UNMUTED;
      muteBtn.setAttribute('aria-pressed', String(!video.muted));
      muteBtn.setAttribute('aria-label', (video.muted ? t('contact.unmute') : t('contact.mute')) || (video.muted ? 'Unmute' : 'Mute'));
    }
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      syncMuteButton();
    });
    syncMuteButton();
    document.addEventListener('langchange', syncMuteButton);
  }
})();
</script>
