<script>
/* Hero bag physics — 8 pieces, gravity + drag, DOM synced to Matter.js bodies */
(function () {
  const container = document.getElementById('bagContent');
  if (!container || typeof Matter === 'undefined') return;

  const { Engine, World, Bodies, Body, Mouse, MouseConstraint, Events } = Matter;

  /* Matter.js collision bodies are smaller than the visual pieces on
     purpose: every shape here (bird, horse, leaf...) is an irregular
     silhouette inside a rectangular (or circular, for nenunfar)
     bounding box that's already tight around the artwork — checked
     the source SVGs directly, none have meaningful transparent
     padding to trim (99.5-100.2% opaque fill on every one). Two tight
     bounding boxes can still only ever *touch*, never let the actual
     silhouettes inside them overlap — a bird's beak reaching one
     corner doesn't mean its tail reaches the opposite one. Shrinking
     just the physics body (not the DOM element, which stays full
     size) lets neighboring silhouettes visually overlap once their
     smaller collision boxes touch, the way real loose paper cutouts
     piled in a bag actually overlap. */
  const COLLISION_SCALE = 0.80;

  /* w/h keep each real asset's aspect ratio (see assets/shapes/*.svg viewBox) */
  const SHAPES = [
    { type: 'bird',     w: 240, h: 238, circle: false, color: '#1546F4', img: 'bird.svg' },
    { type: 'poodle',   w: 242, h: 223,  circle: false, color: '#D82618', img: 'poodle.svg' },
    { type: 'horse',    w: 247, h: 243, circle: false, color: '#1B5744', img: 'horse.svg' },
    { type: 'leaf',     w: 220,  h: 226,  circle: false, color: '#D00071', img: 'leaf.svg' },
    { type: 'fish',     w: 230, h: 196,  circle: false, color: '#C9B189', img: 'fish.svg' },
    { type: 'nenunfar', w: 204,  h: 204,  circle: true,  color: '#C6D90A', img: 'nenunfar.svg' },
  ];

  const engine = Engine.create();
  const world = engine.world;
  engine.gravity.y = 1;
  engine.enableSleeping = true;

  let W = 0;
  let H = 0;
  const wallT = 60;
  let walls = [];
  let pieces = [];
  const bodies = [];
  const els = [];
  let initialized = false;

  function buildWalls() {
    if (walls.length) World.remove(world, walls);
    walls = [
      Bodies.rectangle(W / 2, H + wallT / 2, W + wallT * 2, wallT, { isStatic: true }), // floor
      Bodies.rectangle(-wallT / 2, H / 2, wallT, H * 3, { isStatic: true }),            // left
      Bodies.rectangle(W + wallT / 2, H / 2, wallT, H * 3, { isStatic: true }),          // right
    ];

    World.add(world, walls);
  }

  /* First-time setup — creates bodies/DOM pieces once real, non-zero
     dimensions are available. Deferred out of the initial synchronous
     read because container.clientHeight can report 0 here on real
     WebKit/Safari: this box's height comes from an aspect-ratio on an
     ancestor flex item, and that computation isn't always settled by
     the time this script runs, even though clientWidth already is.
     Building the physics floor at height 0 sent every piece falling
     straight past it, off-screen forever — invisible bag, no error. */
  function init() {
    initialized = true;

    /* SHAPES' w/h are sized for the 860px reference width (.home-bag-wrap's
       max-width). On narrow mobile containers those pieces are as big as
       the box itself, which makes Matter's solver "explode" overlapping
       bodies out past the walls — scale them down to match the real
       container width so they never outsize the space they fall into. */
    const scale = Math.min(1, W / 860);
    pieces = SHAPES.map(s => ({ ...s, w: s.w * scale, h: s.h * scale }));

    buildWalls();

    pieces.forEach((s, i) => {
      const x = W / 2 + (Math.random() - 0.5) * (W * 0.5);
      const y = -80 - i * 90;
      const bw = s.w * COLLISION_SCALE;
      const bh = s.h * COLLISION_SCALE;
      const body = s.circle
        ? Bodies.circle(x, y, bw / 2, { restitution: 0.15, friction: 0.5 })
        : Bodies.rectangle(x, y, bw, bh, { restitution: 0.15, friction: 0.5 });
      Body.setAngle(body, (Math.random() - 0.5) * 0.6);
      World.add(world, body);
      bodies.push(body);

      const el = document.createElement('div');
      el.className = 'bag-shape piece-' + s.type + (s.img ? ' bag-shape--cutout' : '');
      el.style.width = s.w + 'px';
      el.style.height = s.h + 'px';
      if (s.img) {
        el.style.backgroundImage = `url('assets/shapes/${s.img}')`;
        el.style.backgroundSize = 'contain';
        el.style.backgroundRepeat = 'no-repeat';
        el.style.backgroundPosition = 'center';
      } else {
        el.style.background = s.color;
        if (s.circle) el.style.borderRadius = '50%';
      }
      container.appendChild(el);
      els.push(el);
    });

    const mouse = Mouse.create(container);
    mouse.element.removeEventListener('mousewheel', mouse.mousewheel);
    mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel);

    const mouseConstraint = MouseConstraint.create(engine, {
      mouse,
      constraint: { stiffness: 0.2, render: { visible: false } }
    });
    World.add(world, mouseConstraint);

    Events.on(mouseConstraint, 'startdrag', e => {
      const i = bodies.indexOf(e.body);
      if (i > -1) els[i].style.zIndex = 50;
    });
    Events.on(mouseConstraint, 'enddrag', e => {
      const i = bodies.indexOf(e.body);
      if (i > -1) els[i].style.zIndex = 10;
    });

    function tick() {
      Engine.update(engine, 1000 / 60);
      bodies.forEach((body, i) => {
        const s = pieces[i];
        els[i].style.transform =
          `translate(${body.position.x - s.w / 2}px, ${body.position.y - s.h / 2}px) rotate(${body.angle}rad)`;
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ResizeObserver instead of a one-shot synchronous read: fires as soon
     as the browser actually settles on a real size (whenever that is —
     immediately, or after the aspect-ratio quirk above resolves), and
     keeps firing on every real size change after that (rotation, resize),
     which a window 'resize' listener won't catch when only *this*
     element's internal layout changes without the viewport moving. */
  let resizeTimer;
  new ResizeObserver(entries => {
    const box = entries[0].contentRect;
    if (box.width === 0 || box.height === 0) return;
    W = box.width;
    H = box.height;

    if (!initialized) {
      init();
      return;
    }

    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildWalls, 200);
  }).observe(container);
})();

/* Fit title full width — shared with contact.html, see scripts/fit-title.js */
fitTitleToWidth(document.querySelector('.work-title'));

/* Discipline grid pagination — dots stay hidden while every category
   fits in one row (comp-category-grid's minmax(180px,1fr) columns).
   Once it overflows (5th category added, or a narrow viewport), the
   grid becomes a snap-scrolling strip and this builds one dot per
   page, wires click-to-page, and keeps the active dot in sync on
   scroll/resize. Page count is derived from real scrollWidth, never
   hardcoded to today's 4 items. */
(function () {
  const grid = document.querySelector('.comp-category-grid');
  const dotsWrap = document.getElementById('categoryDots');
  if (!grid || !dotsWrap) return;

  let pageCount = 0;

  function buildDots(count) {
    dotsWrap.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const dot = document.createElement('span');
      dot.className = 'pdot';
      dot.addEventListener('click', () => {
        grid.scrollTo({ left: i * grid.clientWidth, behavior: 'smooth' });
      });
      dotsWrap.appendChild(dot);
    }
  }

  function updateActiveDot() {
    if (!pageCount) return;
    const idx = Math.min(pageCount - 1, Math.round(grid.scrollLeft / grid.clientWidth));
    dotsWrap.querySelectorAll('.pdot').forEach((dot, i) => {
      dot.classList.toggle('is-active', i === idx);
    });
  }

  function refresh() {
    const overflowing = grid.scrollWidth > grid.clientWidth + 1;
    grid.classList.toggle('is-paged', overflowing);
    dotsWrap.classList.toggle('is-active', overflowing);

    if (!overflowing) {
      pageCount = 0;
      dotsWrap.innerHTML = '';
      return;
    }

    const newPageCount = Math.max(1, Math.round(grid.scrollWidth / grid.clientWidth));
    if (newPageCount !== pageCount) {
      pageCount = newPageCount;
      buildDots(pageCount);
    }
    updateActiveDot();
  }

  grid.addEventListener('scroll', updateActiveDot);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refresh, 200);
  });

  /* Grid items now come from render-category-grid.js (async fetch of
     data/disciplines.json), so they don't exist yet at parse time —
     re-measure once real items land, and again on every langchange
     (titleLines line count can change between ES/EN). */
  document.addEventListener('categorygridready', refresh);

  refresh();
})();

/* Drag-scroll project strip */
(function () {
  const strip = document.getElementById('projectsStrip');
  let down = false, startX, scrollLeft;
  strip.addEventListener('mousedown', e => {
    down = true; startX = e.pageX - strip.offsetLeft; scrollLeft = strip.scrollLeft;
  });
  document.addEventListener('mouseup', () => { down = false; });
  strip.addEventListener('mousemove', e => {
    if (!down) return;
    e.preventDefault();
    strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX);
  });
  /* prevent nav on drag */
  strip.addEventListener('click', e => {
    if (Math.abs(strip.scrollLeft - scrollLeft) > 4) e.preventDefault();
  });
})();
</script>
