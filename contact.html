<script src="scripts/fit-title.js"></script>
<script>
/* Live Madrid clock */
(function () {
  const el = document.getElementById('madridClock');
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Madrid',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  const tick = () => { el.textContent = `Madrid, ${fmt.format(new Date())}`; };
  tick();
  setInterval(tick, 1000);
})();

/* Fit outline title to available width — shared with work.html, see scripts/fit-title.js */
fitTitleToWidth(document.querySelector('.contact-outline'), { max: 60 });

/* Decorative avatar video: plays once on load, freezes on its last
   frame, and replays from the start on hover — never a manual player. */
(function () {
  const video = document.getElementById('contactVideo');
  if (!video) return;

  const freezeOnLastFrame = () => {
    video.currentTime = Math.max(0, video.duration - 0.05);
    video.pause();
  };

  video.addEventListener('ended', freezeOnLastFrame);

  video.closest('.contact-avatar').addEventListener('mouseenter', () => {
    video.currentTime = 0;
    video.play();
  });
})();
</script>
